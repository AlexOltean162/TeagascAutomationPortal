<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Teagasc Automation Portal</title>
  <meta name="description" content="Browse Teagasc automation tools and submit workflow improvement ideas." />
  <meta name="theme-color" content="#f3f1eb" />
  <link rel="preconnect" href="https://excelvalidator.teagasc.net/" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="#top" aria-label="Teagasc Automation Portal home">
        <span class="brand__mark" aria-hidden="true">
          <img class="brand__logo" src="data-report-svgrepo-com.svg" alt="" />
        </span>
        <span class="brand__text">
          <span class="brand__title">Teagasc Data Portal</span>
          <span class="brand__sub">Internal tools and workflow improvements</span>
        </span>
      </a>

      <nav class="nav" aria-label="Primary">
        <a class="nav__link" href="#apps">MyData Portal</a>
        <a class="nav__link" href="https://teagask.teagasc.net/aiportal/">AI Portal</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="container section section--tight" id="apps">
      <div class="section__head">
        <div>
          <p class="eyebrow">Tools</p>
          <h2 class="section__title">Available applications</h2>
        </div>
      </div>

      <div class="grid" id="appsGrid" aria-label="Automation apps grid"></div>
    </section>

    <section class="container section" id="idea">
      <div class="section__head">
        <div>
          <p class="eyebrow">Ideas</p>
          <h2 class="section__title">Submit a workflow improvement idea</h2>
        </div>
      </div>

      <div class="ideaLayout">
        <div class="panel">
          <form class="form" id="ideaForm" novalidate>
            <div class="panel__head">
              <h3 class="panel__title">Send your idea to the ICT Research &amp; Innovation team</h3>
            </div>

            <div class="form__row">
              <label class="field">
                <span class="field__label">Your name</span>
                <input class="field__input" type="text" name="name" autocomplete="name" />
              </label>

              <label class="field">
                <span class="field__label">Your email</span>
                <input class="field__input" type="email" name="email" autocomplete="email" />
              </label>
            </div>

            <label class="field">
              <span class="field__label">Business unit <span class="req">*</span></span>
              <input class="field__input" name="businessUnit" required
                placeholder="e.g. Research, Operations, Advisory" maxlength="120" />
            </label>

            <label class="field">
              <span class="field__label">Idea title <span class="req">*</span></span>
              <input class="field__input" name="title" required maxlength="120" />
            </label>

            <label class="field">
              <span class="field__label">Current workflow and proposed improvement <span class="req">*</span></span>
              <textarea class="field__input field__textarea" name="description" required maxlength="5000"
                placeholder="Describe what happens today, what should change, and what success would look like."></textarea>
            </label>

            <div class="form__row">
              <label class="field">
                <span class="field__label">Data sources</span>
                <input class="field__input" name="dataSources" placeholder="e.g. Excel, SharePoint, SQL, APIs" />
              </label>

              <label class="field">
                <span class="field__label">Expected benefits</span>
                <input class="field__input" name="expectedBenefits" placeholder="e.g. time saved, fewer errors" />
              </label>
            </div>

            <div class="form__actions">
              <button class="btn btn--primary" type="submit" id="submitBtn">Send idea</button>
              <div class="form__status" id="formStatus" role="status" aria-live="polite"></div>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__text">MyData Portal</p>
    </div>
  </footer>

  <script src="app.js" defer></script>
</body>

</html>
