##
# Teagasc Automation Portal
# Served under: https://ai.teagasc.net/mydata
#
# Usage:
# - Include this snippet inside the existing `server {}` for ai.teagasc.net
# - Ensure the Node app is running on localhost:3000
##

# Redirect /mydata -> /mydata/
location = /mydata {
  return 301 /mydata/;
}

# Main app (subpath reverse proxy)
location /mydata/ {
  proxy_pass http://127.0.0.1:3000/;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Prefix /mydata;

  # Rewrites for absolute asset/API paths in HTML/JS
  sub_filter_once off;
  sub_filter_types text/html application/javascript text/css;
  sub_filter '"/styles.css"' '"/mydata/styles.css"';
  sub_filter '"/app.js"' '"/mydata/app.js"';
  sub_filter '"/api/ideas"' '"/mydata/api/ideas"';
  sub_filter '"/api/config"' '"/mydata/api/config"';
}
